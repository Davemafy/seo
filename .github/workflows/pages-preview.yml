name: Sloppertizer public visual preview
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages-preview.yml
      - src/package_preview.py
      - src/polish_preview.py
      - src/finish_preview.py
      - src/verify-static-preview.mjs
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sloppertizer-static-preview
  cancel-in-progress: false
jobs:
  build:
    name: Build isolated static redesign preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: stage-led-detailed-source
          run-id: 42978114289
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Apply scoped brand and interactive demo improvements
        run: python3 src/polish_preview.py candidate candidate-polished
      - name: Apply independently verified editorial finish
        run: python3 src/finish_preview.py candidate-polished candidate-finished
      - name: Package client-only landing from verified experiment
        run: python3 src/package_preview.py candidate-finished preview
      - name: Install frontend dependencies without lifecycle scripts
        run: npm --prefix preview install --ignore-scripts --no-audit --no-fund
      - name: Build static browser app
        run: npm --prefix preview run build
      - name: Install headless Chromium for static preview smoke test
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test packaged browser app at desktop and mobile sizes
        run: |
          (cd preview && npx vite preview --host 127.0.0.1 --port 4173) >/tmp/static-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/seo/ >/dev/null 2>&1 && break; sleep 1; done
          node src/verify-static-preview.mjs http://127.0.0.1:4173/seo/
      - name: Verify static output and attribution
        run: |
          test -f preview/public-preview/index.html
          test -f preview/LICENSE
          test ! -e preview/.env
          grep -q '/seo/' preview/public-preview/index.html
          ! grep -R -l 'VULTR_INFERENCE_API_KEY' preview/public-preview
      - name: Preserve deployable static artifact
        uses: actions/upload-artifact@v4
        with:
          name: sloppertizer-visual-preview-static
          path: preview/public-preview/
          retention-days: 14
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages bundle
        uses: actions/upload-pages-artifact@v4
        with:
          path: preview/public-preview/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy separate preview
        id: deployment
        uses: actions/deploy-pages@v4

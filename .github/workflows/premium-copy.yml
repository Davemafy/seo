name: Portable semantic copy upgrade — independent Cactus benchmark
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/premium-copy.yml
      - src/engine/editorial-copy.mjs
      - src/lib.mjs
      - test/editorial-copy.test.mjs
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: premium-source-grounded-copy
  cancel-in-progress: false
jobs:
  revise:
    name: Repair the source-grounded pricing story without changing JSX functionality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: 43005387856
          name: premium-contrast-repaired-source
          path: source
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: 43009062829
          name: premium-editorial-candidate
          path: editorial
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: 43009062829
          name: premium-editorial-jury
          path: previous-critique
      - name: Reconstitute the latest browser-accepted React candidate
        run: |
          cp editorial/candidate-repaired/src/App.tsx source/src/App.tsx
          cp editorial/candidate-repaired/src/sloppertizer.sections.css source/src/sloppertizer.sections.css
          cp editorial/candidate-repaired/src/sloppertizer.contrast.css source/src/sloppertizer.contrast.css
      - name: Install only the known engine dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Propose tightly scoped real-plan pricing copy
        env:
          VULTR_INFERENCE_API_KEY: ${{ secrets.VULTR_INFERENCE_API_KEY }}
        run: |
          test -n "$VULTR_INFERENCE_API_KEY" || (echo "::error::Missing inference key" && exit 1)
          node src/engine/editorial-copy.mjs --project source --output candidate --feedback previous-critique/jury.json
      - name: Export source with verified edit scope
        uses: actions/upload-artifact@v4
        with:
          name: cactus-premium-editorial-source
          path: candidate/
          retention-days: 14
  verify:
    name: Build and verify final React product story in a no-key runner
    needs: revise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: cactus-premium-editorial-source
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: 43009062829
          name: premium-editorial-candidate
          path: previous
      - name: Install safe browser QA dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build newly edited React app
        run: |
          npm ci --prefix candidate --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm --prefix candidate run build
      - name: Render the final desktop and mobile website
        run: |
          npm --prefix candidate run dev -- --host 127.0.0.1 --port 3000 --strictPort >/tmp/cactus-premium-copy.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1 && break; sleep 1; done
          node src/engine/capture.mjs --url http://127.0.0.1:3000/ --output rendered
      - name: Compare original links, accessibility and page height
        id: gate
        continue-on-error: true
        run: node src/engine/selection.mjs --before previous/final-screenshots/report.json --after rendered/report.json --output gate.json
      - name: Preserve rendered evidence even if rejected
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cactus-premium-editorial-evidence
          path: |
            rendered/
            gate.json
          retention-days: 14
          if-no-files-found: warn
      - name: Reject any runtime or accessibility regression
        if: steps.gate.outcome == 'failure'
        run: exit 1
  jury:
    name: Independent human-standard visual jury (advisory)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: 42997189529
          name: premium-layout-editorial-stage
          path: original
      - uses: actions/download-artifact@v4
        with:
          name: cactus-premium-editorial-evidence
          path: current
      - name: Compare original vs new desktop and mobile compositions
        env:
          VULTR_INFERENCE_API_KEY: ${{ secrets.VULTR_INFERENCE_API_KEY }}
        run: |
          test -n "$VULTR_INFERENCE_API_KEY" || (echo "::error::Missing inference key" && exit 1)
          node src/engine/visual-jury.mjs --original original/baseline-settled/desktop.png --candidate current/rendered/desktop.png --mobile current/rendered/mobile.png --output visual-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: cactus-premium-editorial-jury
          path: visual-review.json
          retention-days: 14

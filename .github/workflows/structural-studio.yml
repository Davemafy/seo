name: Sloppertizer — structural creative breakthrough trial
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/structural-studio.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sloppertizer-structural-trial
  cancel-in-progress: false
jobs:
  generate:
    name: Build an original React page with one model and actual screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reuse pinned MIT source without executing it
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: 43267092062
          name: taste-original-source
          path: source
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: 43267092062
          name: taste-original-evidence
          path: original
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: 43267092062
          name: taste-generated-candidate
          path: creative-reference
      - name: Validate code first, run inference once, do not execute untrusted app here
        env:
          VULTR_INFERENCE_API_KEY: ${{ secrets.VULTR_INFERENCE_API_KEY }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          node --check src/engine/creative-verify.mjs
          test -n "$VULTR_INFERENCE_API_KEY" || (echo "::error::Inference credential missing" && exit 1)
          node src/engine/structural-studio.mjs \
            --project source \
            --desktop original/desktop.png \
            --mobile original/mobile.png \
            --concept creative-reference/taste-profile.json \
            --model glm-5.2 \
            --output studio
      - name: Preserve raw model output, accepted candidate and all rejections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-studio-generation
          path: studio/
          retention-days: 14
          if-no-files-found: warn

  browser:
    name: Compile and exercise the page in a no-secret Chromium worker
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: structural-studio-generation
          path: studio
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: 43267092062
          name: taste-original-evidence
          path: original
      - name: Install app with no inference credentials and compile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix studio/candidate --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm --prefix studio/candidate run build
        env: &demo
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-public-only
          VITE_SUPABASE_ANON_KEY: test-public-only
      - name: Screenshot both sizes and verify live tabs, routes, FAQ and keyboard
        env: *demo
        run: |
          npx playwright install --with-deps chromium
          npm --prefix studio/candidate run dev -- --host 127.0.0.1 --port 3284 --strictPort >/tmp/studio-demo.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 55); do curl -fsS http://127.0.0.1:3284/ >/dev/null 2>&1 && break; sleep 1; done
          node src/engine/capture.mjs --url http://127.0.0.1:3284/ --output browser-proof || true
          node src/engine/creative-verify.mjs --url http://127.0.0.1:3284/ --output browser-proof
          node --input-type=module - <<'CHECK'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('browser-proof/report.json'));
          const original=JSON.parse(fs.readFileSync('original/report.json'));
          for(const view of ['desktop','mobile']){
            const b=x[view],a=original[view];
            if(b.status!==200||b.errors.length||b.brokenImages.length||b.horizontalOverflow||b.textCollisions.length||!b.accessibility?.verified||b.accessibility.contrastFailures>0)
              throw Error(view+': layout/accessibility regression');
            if(b.pageHeight>a.pageHeight*1.3)throw Error(view+': >30% unearned page growth');
          }
          CHECK
      - name: Always retain screenshots, crashes, reports, receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-studio-browser-evidence
          path: |
            browser-proof/
            studio/structural-receipt.json
          retention-days: 14
          if-no-files-found: warn
  jury:
    name: Independent screenshot judge, no candidate promotion
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: structural-studio-browser-evidence
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: 43267092062
          name: taste-original-evidence
          path: original
      - name: Demand actual screenshot evidence, not model claims
        env:
          VULTR_INFERENCE_API_KEY: ${{ secrets.VULTR_INFERENCE_API_KEY }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          test -n "$VULTR_INFERENCE_API_KEY" || exit 1
          node src/engine/visual-jury.mjs \
            --original original/desktop.png \
            --candidate evidence/browser-proof/desktop.png \
            --mobile evidence/browser-proof/mobile.png \
            --model muse-glimmer-30b \
            --output studio-jury.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-studio-visual-jury
          path: studio-jury.json
          retention-days: 14
          if-no-files-found: warn

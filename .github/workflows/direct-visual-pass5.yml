name: Pilot 01 - direct visual references (Pass 5)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-visual-pass5.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  generate:
    name: Directly send reference image pixels to Vultr code model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-v2
          run-id: 42884884229
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: prior
      - uses: actions/download-artifact@v4
        with:
          name: candidate-v2-screens
          run-id: 42884884229
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: pass2
      - uses: actions/download-artifact@v4
        with:
          name: ref-shots
          run-id: 42907884151
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ref-shots
      - uses: actions/download-artifact@v4
        with:
          name: screenshot-grounded-direction
          run-id: 42907884151
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: .
      - name: Produce actual image-conditioned React + CSS
        env:
          VULTR_INFERENCE_API_KEY: ${{ secrets.VULTR_INFERENCE_API_KEY }}
        run: |
          test -n "$VULTR_INFERENCE_API_KEY" || (echo "::error::Vultr key not configured" && exit 1)
          node src/vision-pilot.mjs --project ./prior --refs ./ref-shots --before ./pass2/candidate-shots/desktop.png --direction ./visual-guidance.md --output ./candidate-v5 --model glm-5.2
      - name: Export generated source
        uses: actions/upload-artifact@v4
        with:
          name: direct-vision-source
          path: candidate-v5/
          retention-days: 14

  verify:
    name: Build, render, semantic interactions and strict visual geometry
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: direct-vision-source
          path: candidate-v5
      - uses: actions/download-artifact@v4
        with:
          name: candidate-v2-screens
          run-id: 42884884229
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: pass2
      - name: Install browser and generated app in a worker without any secrets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          cd candidate-v5
          npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Compile generated frontend without credentials
        env: &dummy
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sloppertizer-test-only
          VITE_SUPABASE_ANON_KEY: sloppertizer-test-only
        run: npm --prefix candidate-v5 run build
      - name: Capture at fixed desktop and mobile viewports
        env: *dummy
        run: |
          npm --prefix candidate-v5 run dev -- --host 127.0.0.1 --port 3000 --strictPort >/tmp/sloppertizer-v5.log 2>&1 &
          for i in $(seq 1 35); do curl -sf http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          node src/capture.mjs --url http://127.0.0.1:3000/ --output screenshots
      - name: Verify user interactions and semantic components
        run: node src/interactions.mjs http://127.0.0.1:3000/
      - name: Compare layout and typography to Pass 2
        id: gate
        continue-on-error: true
        run: |
          node src/visual-quality-gate.mjs --baseline pass2/candidate-shots/report.json --candidate screenshots/report.json --url http://127.0.0.1:3000/ --output geometry-verdict.json
      - name: Upload screenshot and layout evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-vision-screens
          path: |
            screenshots/
            geometry-verdict.json
          retention-days: 14
          if-no-files-found: warn
      - name: Reject failed regression gate
        if: steps.gate.outcome == 'failure'
        run: |
          echo "::error::Direct vision result is not better on objective viewport metrics. Retain Pass 2."
          exit 1

  critique:
    name: Compare Pass 2 against direct-image design
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: direct-vision-screens
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: candidate-v2-screens
          run-id: 42884884229
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: pass2
      - name: Compare actual desktop and mobile images
        env:
          VULTR_INFERENCE_API_KEY: ${{ secrets.VULTR_INFERENCE_API_KEY }}
        run: |
          node src/critique.mjs --before pass2/candidate-shots/desktop.png --after candidate/screenshots/desktop.png --mobile candidate/screenshots/mobile.png --output direct-vision-critique.json
      - uses: actions/upload-artifact@v4
        with:
          name: direct-vision-critique
          path: direct-vision-critique.json
          retention-days: 14
